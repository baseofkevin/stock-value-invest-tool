<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f5f6f4; --card:#fff; --ink:#1f2933; --muted:#66727f; --line:#e3e8ee;
  --primary:#2f6152; --primary-dark:#1d4034;
  --low:#1f7a4d; --high:#b3261e; --warn:#9a6700; --soft:#f7f9fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}

header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:28px 20px 24px}
header .inner{max-width:1080px;margin:0 auto}
header h1{margin:0 0 6px;font-size:25px;letter-spacing:.4px}
header .sub{opacity:.85;font-size:13px;font-variant-numeric:tabular-nums}
header .stats{margin-top:16px;display:flex;flex-wrap:wrap;gap:9px}
header .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

.wrap{max-width:1080px;margin:0 auto;padding:20px}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input{flex:1;max-width:420px;padding:9px 13px;border:1px solid var(--line);
  border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
.toolbar input:focus{outline:2px solid rgba(47,97,82,.25);border-color:var(--primary)}
.toolbar .count{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

.tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:0 1px 2px rgba(20,40,60,.04)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--soft);color:#40566a;font-weight:600;font-size:12px;
  text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
td.code{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:#33463f}
td.num.null{color:#b8c2cc}

.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;
  font-weight:700;white-space:nowrap;margin:2px 4px 2px 0}
.b-cycle-yes{background:#e3efe9;color:var(--primary-dark)}
.b-cycle-no{background:#eef1f4;color:var(--muted)}
.b-strong{background:#e3efe9;color:var(--primary-dark)}
.b-weak{background:#eef1f4;color:var(--muted)}
.b-unstable{background:#fdf0d0;color:var(--warn)}
.b-low{background:#dff3e7;color:var(--low)}
.b-high{background:#fbe3e1;color:var(--high)}
.b-neutral{background:#eef1f4;color:var(--muted)}
.b-muted{background:#eef1f4;color:var(--muted)}
.b-dup{background:#fdf0d0;color:var(--warn)}
/* 判断① 走相对波动通道（CV）时补的小标记：结论一致，只是归因不同 */
.b-cv{background:#eef4f9;color:#31566e}
/* 「①否②强」的矛盾提示：不是结论，用琥珀色描边把它跟实心徽章区分开 */
.b-contra{background:#fff;color:var(--warn);box-shadow:inset 0 0 0 1px #e8cf9a}
/* 产能方向：给「低位/高位」加限定语的辅助标记，中性描边不抢主徽章 */
.b-capacity{background:#fff;color:#5b6b78;box-shadow:inset 0 0 0 1px #d5dee6}

.btn{display:inline-block;padding:5px 13px;border-radius:8px;background:var(--primary);
  color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--primary-dark)}
.btn.disabled{background:#eef1f4;color:#a8b3bd;cursor:default}
.btn.disabled:hover{background:#eef1f4}
/* 次按钮：东方财富跳转。描边而非填充，避免跟主按钮抢注意力 */
.btn.alt{background:#fff;color:var(--primary);box-shadow:inset 0 0 0 1px #cfdbe4}
.btn.alt:hover{background:#f2f7f5;box-shadow:inset 0 0 0 1px var(--primary)}

.reason{color:var(--muted);font-size:12px}
.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:40px 20px;text-align:center;color:var(--muted)}

.foot{max-width:1080px;margin:22px auto 40px;padding:0 20px;color:var(--muted);
  font-size:12px;line-height:1.8}
.foot b{color:#425466}

@media (max-width:720px){
  header{padding:20px 14px}
  header h1{font-size:21px}
  .wrap{padding:12px}
  table{font-size:12.5px}
  thead th,tbody td{padding:8px 8px}
  td.name{max-width:110px}
  .toolbar input{max-width:none}
}
@media print{
  body{background:#fff}
  header{background:#fff;color:#1f2933;border-bottom:2px solid var(--line)}
  header .stat{background:#f2f4f6;border-color:var(--line);color:#40566a}
  .toolbar{display:none}
  thead th{position:static}
}
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUBTITLE}}</div>
    <div class="stats">
      {{STATS}}
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索代码、名称或标签…" autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  {{TABLE}}
</div>

<div class="foot">
  <p><b>说明</b> 本页仅为初筛结果索引，标签为读数不是结论，命中不代表买入机会。</p>
  <p><b>三个判断</b> ① 毛利率 5 年标准差 ≥ 5pp 判周期股；② 近 8 季「利润增速÷收入增速」中位 ≥ 2.0 判弹性强；③ 产能周转率 10 年分位 &lt;40% 低位、&gt;60% 高位。</p>
  <p><b>不排序</b> 本页有意不提供排序按钮 —— 初筛不做排序是本工具的方法论立场（见 README.md「设计取舍」）。</p>
  <p>生成于 {{GENERATED_AT}}</p>
</div>

<script>
(function(){
  var input = document.getElementById('q');
  var countEl = document.getElementById('count');
  var rows = Array.prototype.slice.call(document.querySelectorAll('#rows tr'));
  function apply(){
    var term = (input.value || '').trim().toLowerCase();
    var shown = 0;
    rows.forEach(function(tr){
      var hay = (tr.getAttribute('data-search') || '').toLowerCase();
      var hit = !term || hay.indexOf(term) !== -1;
      tr.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    countEl.textContent = shown === rows.length
      ? ('共 ' + rows.length + ' 只')
      : ('显示 ' + shown + ' / ' + rows.length + ' 只');
  }
  if (input) { input.addEventListener('input', apply); }
  apply();
})();
</script>
</body>
</html>
