tic/config.py · decide.py</text><text x="464.5" y="2217.1" font-size="10.200000000000001" fill="#1f4e79" font-weight="700" text-anchor="start">① 是不是周期股（两条通道 OR）</text><text x="464.5" y="2233.9" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="474.5" y="2234.5" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">绝对：20 季单季毛利率 σ ≥ 5.0pp</text><text x="464.5" y="2250.3" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="474.5" y="2250.9" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">相对：CV = σ/|中位| ≥ 20%，且中位 ≥5%、σ ≥2.0pp</text><text x="464.5" y="2265.9" font-size="10.200000000000001" fill="#1f4e79" font-weight="700" text-anchor="start">② 弹性（8 季环比 DOL 中位数）</text><text x="464.5" y="2282.7" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="474.5" y="2283.3" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">≥2.0 强 / &lt;2.0 弱 / 营收同比中位 &lt;3% 或跨零 &gt;1/3 → 不稳定</text><text x="464.5" y="2298.3" font-size="10.200000000000001" fill="#1f4e79" font-weight="700" text-anchor="start">③ 周期位置（产能周转率 40 季分位）</text><text x="464.5" y="2315.1" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="474.5" y="2315.7" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">&lt;40% 低位 / &gt;60% 高位 / 中间不给标签；金融股「不适用」</text><text x="464.5" y="2330.7" font-size="10.200000000000001" fill="#1f4e79" font-weight="700" text-anchor="start">数据保护（不是判定阈值）</text><text x="464.5" y="2347.5" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="474.5" y="2348.1" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">单季营收增速 &lt;0.5% 则该季比值跳过；比值 &gt;50 剔除；样本 &lt;4 置空</text><text x="464.5" y="2364.5" font-size="10.200000000000001" fill="#5b6570" font-weight="400" text-anchor="start">判据来源：东北证券 5pp / 招商 30% 出清口径放宽到 40%</text><text x="464.5" y="2379.5" font-size="10.200000000000001" fill="#1f4e79" font-weight="700" text-anchor="start">页面上的「· 订单回升」是另一回事</text><text x="464.5" y="2396.3" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="474.5" y="2396.9" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">合同负债同比 ≥+20% / ≤−10%，且占年化营收 ≥2% 才认；只加限定语，不改分</text><text x="474.5" y="2413.3" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">位与标签</text><rect x="867.0" y="2162.6" width="399.5" height="285.2" rx="8" fill="#ffffff" stroke="#9db8d0" stroke-width="1.2"/><text x="878.0" y="2184.6" font-size="11.6" fill="#1f4e79" font-weight="700" text-anchor="start">质量：Q、V 与结论矩阵</text><text x="878.0" y="2198.1" font-size="9.6" fill="#3f6a92" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">stock_quality_screen/config.py</text><text x="878.0" y="2218.5" font-size="10.200000000000001" fill="#5b6570" font-weight="400" text-anchor="start">Q（100）　资本回报30 · 现金25 · 资产负债表20 · 成长15 · 会计10</text><text x="878.0" y="2234.9" font-size="10.200000000000001" fill="#5b6570" font-weight="400" text-anchor="start">V（100）　目标价空间40% + 预测PE相对20% + 净利增速40%</text><text x="878.0" y="2249.9" font-size="10.200000000000001" fill="#1f4e79" font-weight="700" text-anchor="start">结论矩阵（Q 越低，要求 V 越高）</text><text x="878.0" y="2266.7" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="888.0" y="2267.3" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">Q≥75：V≥65 买入 / ≥50 等价格 / ≥35 偏贵 / &lt;35 太贵</text><text x="878.0" y="2283.1" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="888.0" y="2283.7" font-size="9.8" fill="#1f2328" font-weight="400" text-anchor="start">Q65–75：V≥80 买入 / ≥70 可买 / ≥50 观察 / &lt;50 回避</text><text x="878.0" y="2299.5" font-size="11.8" fill="#9db8d0" font-weight="700" text-anchor="start">·</text><text x="888.0" y="2300.1" font-size="9.8" fill="#1f2328
